  notify-slack:
    runs-on: ubuntu-latest
    needs: [build-for-ios, build-for-android, build-for-windows, build-for-macos-x86_64, build-for-macos-aarch64, build-for-macos-universal, build-for-linux]
    if: always()
    steps:
      - name: Determine release URL
        id: release_url
        run: |
          if [ "${{ github.event_name }}" == "push" ]; then
            echo "url=https://github.com/${{ github.repository }}/releases/tag/${{ github.ref_name }}" >> $GITHUB_OUTPUT
          elif [ "${{ needs.prepare.outputs.create_release }}" == "true" ]; then
            echo "url=https://github.com/${{ github.repository }}/releases/tag/v${{ needs.prepare.outputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "url=Manual build completed - no release created" >> $GITHUB_OUTPUT
          fi

      - uses: 8398a7/action-slack@v3
        with:
          status: ${{ job.status }}
          text: |
            Workflow ${{ github.workflow }} in repository ${{ github.repository }} has completed successfully!

            **Mobile Platforms:**
            • iOS: ${{ needs.build-for-ios.result }}
            • Android: ${{ needs.build-for-android.result }}

            **Desktop Platforms:**
            • Windows: ${{ needs.build-for-windows.result }}
            • macOS x86_64: ${{ needs.build-for-macos-x86_64.result }}
            • macOS aarch64: ${{ needs.build-for-macos-aarch64.result }}
            • macOS Universal: ${{ needs.build-for-macos-universal.result }}
            • Linux: ${{ needs.build-for-linux.result }}

            🔗 Release: ${{ steps.release_url.outputs.url }}
          fields: repo,message,commit,author,eventName,ref,workflow,job,took
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        if: always()
